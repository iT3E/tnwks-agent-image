---
name: "Claude CLI test"

# Not managed by Copier: a test of this repository only.
#
# OpenClaw's Claude CLI runtime behind a model gateway, on a kind cluster:
# where the model calls go, where the tools run, and which Claude Code native
# tools the model can reach (tests/test_claude_cli.py). It builds the image as
# the image job does, adds Claude Code in a test layer
# (tests/claude-cli/Dockerfile), and runs tests/claude-cli/run.sh. The image
# that ships holds no Claude Code. It is a job of its own, so a failure here
# hides no result of the image job.
on:
  pull_request:
    paths:
      - "Dockerfile"
      - "tests/**"
      - "bin/image-test"
      - ".github/test-cluster/**"
      - ".github/workflows/claude-cli.yaml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: claude-cli-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Claude Code release of the test layer.
  # renovate: datasource=npm depName=@anthropic-ai/claude-code
  CLAUDE_CODE_VERSION: "2.1.322"

jobs:
  claude-cli:
    name: claude-cli
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build -t tnwks-agent-image:ci .

      - name: Add Claude Code (test layer)
        run: |
          docker build -f tests/claude-cli/Dockerfile \
            --build-arg IMAGE=tnwks-agent-image:ci \
            --build-arg CLAUDE_CODE_VERSION="$CLAUDE_CODE_VERSION" \
            -t tnwks-agent-image-claude:ci tests/claude-cli

      - name: Run the Claude CLI test
        run: tests/claude-cli/run.sh tnwks-agent-image-claude:ci
